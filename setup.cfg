[metadata]
name = zmq-inference
version = 0.2.0
description = ZMQ-based high-performance inference server and client for PyTorch and TensorFlow models
long_description = file: README.md
long_description_content_type = text/markdown
author = Jamal Saeedi
author_email = jamal.saeedi7@gmail.com
license = MIT
url = https://github.com/jamal-saeedi/zmq-inference-server-client-pytorch-tf
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    License :: OSI Approved :: MIT License
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
python_requires = >=3.9
packages = find:
install_requires =
    pyzmq>=25.0
    Pillow>=9.0
    numpy>=1.23
    click>=8.1

[options.packages.find]
include = zmq_inference*

[options.package_data]
zmq_inference.data =
    imagenet_classes.json

[options.extras_require]
torch =
    torch>=2.0
    torchvision>=0.15
    timm>=0.9
tf =
    tensorflow>=2.10
dev =
    pytest>=7.4
    pytest-asyncio>=0.23
    pytest-cov>=4.1
    black>=23.0
    ruff>=0.1
    mypy>=1.5

[options.entry_points]
console_scripts =
    zmq-inference = zmq_inference.cli.main:cli

[flake8]
max-line-length = 100
